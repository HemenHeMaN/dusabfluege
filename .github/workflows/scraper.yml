name: DUS Abfluege Clean Table

on:
  repository_dispatch:
    types: [scraper]

  workflow_dispatch:

concurrency:
  group: dus-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pakete installieren
        run: pip install google-auth requests

      - name: Scraper ausführen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scraper.py

      - name: Änderungen committen und pushen (nur alle 10 Minuten)
        run: |
          MIN=$((10#$(date +%M)))
          if [ $((MIN % 10)) -ge 3 ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Commit diesmal übersprungen (nur alle 10 Minuten)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cache.json

          if git diff --staged --quiet; then
            echo "Keine Änderungen an cache.json."
          else
            git commit -m "Update cache.json (dus.com Abflüge)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
