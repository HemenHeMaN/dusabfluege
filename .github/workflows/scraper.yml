name: DUS Abfluege Clean Table

on:
  repository_dispatch:
    types: [scraper]

  workflow_dispatch:

concurrency:
  group: dus-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pakete installieren
        run: pip install google-auth requests

      - name: Scraper ausführen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DUSFLUGDATENKEY: ${{ secrets.DUSFLUGDATENKEY }}
        run: |
          # Manueller Start pusht sofort ins Daten-Repo, der Cronjob nur alle 10 Minuten
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scraper.py --force
          else
            python scraper.py
          fi
